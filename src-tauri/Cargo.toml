[package]
name = "voicepaste"
version = "1.5.1"
description = "跨平台便捷语音输入工具"
authors = ["imbytecat"]
license = "MIT"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "voicepaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18"
flate2 = "1"
futures-util = "0.3"
keyring = "4"
open = "5"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-clipboard-manager = "2"
rtrb = "0.4"
rubato = "5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# Keep existing proxy behavior; system-proxy would affect every reqwest client.
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "rustls-tls",
  "zip",
] }
async-openai = { version = "0.42.1", default-features = false, features = [
  "byot",
  "chat-completion",
  "rustls-no-provider",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
  "global_shortcuts",
  "tokio",
] }
gtk = "0.18"
enigo = { version = "0.6", default-features = false, features = [
  "libei_tokio",
  "wayland",
  "x11rb",
] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }
# 0.37.1 makes passive Windows overlays steal focus; remove after tao#1358 ships.
tao = "=0.37.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
