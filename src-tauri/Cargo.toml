[package]
name = "voicepaste"
version = "1.4.0"
description = "跨平台便捷语音输入工具"
authors = ["imbytecat"]
license = "MIT"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "voicepaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# cpal 0.18.1 must stay on windows-core 0.61.2; 0.62 breaks its WASAPI macros.
cpal = "0.18"
flate2 = "1"
futures-util = "0.3"
keyring = "4"
open = "5"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "multipart",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
rtrb = "0.3"
rubato = "4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
async-openai = { version = "0.41.3", default-features = false, features = [
  "byot",
  "chat-completion",
  "rustls-no-provider",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
  "global_shortcuts",
  "tokio",
] }
gtk = "0.18"
enigo = { version = "0.6", default-features = false, features = [
  "libei_tokio",
  "wayland",
  "x11rb",
] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"


[patch.crates-io]
# Tauri 2.11.5 still resolves tao 0.35.3; pin the upstream Wayland decoration fix.
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }
