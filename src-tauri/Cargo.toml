[package]
name = "voicepaste"
version = "0.1.0"
description = "跨平台便捷语音输入工具"
authors = ["imbytecat"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "voicepaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.18"
flate2 = "1"
futures-util = "0.3"
keyring = "4"
open = "5"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
rtrb = "0.3"
rubato = "4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
enigo = { version = "0.6", default-features = false, features = ["libei_tokio", "wayland", "x11rb"] }

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }
macos-accessibility-client = "0.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }
