[tools]
node = "26.7.0"
pnpm = "11.20.0"
rust = { version = "1.97.1", components = ["clippy", "rustfmt"] }

[tasks.dev]
description = "启动 Tauri 开发模式"
env = { CI = "false" }
run = "pnpm tauri dev"

[tasks.build]
description = "构建桌面应用，不生成安装包"
env = { CI = "true" }
run = "pnpm tauri build --no-bundle"

[tasks.bundle]
description = "在标准发行系统构建当前平台安装包"
env = { CI = "true" }
run = "pnpm tauri build"

[tasks.check]
description = "检查前端、Rust、测试与 Clippy"
run = "pnpm check && cargo test --manifest-path src-tauri/Cargo.toml && cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings"

[tasks.pre-commit]
description = "提交前运行完整项目检查"
run = "mise run check"

[tasks.commit-msg]
description = "校验中文 Conventional Commit 标题"
run = "node tools/check-commit-message.ts"

[tasks."hooks:install"]
description = "安装仓库 Git hooks"
run = """
mise generate git-pre-commit --write --task=pre-commit
install -m 755 tools/git-hooks/commit-msg .git/hooks/commit-msg
"""

[tasks.fix]
description = "自动修复前端与 Rust 格式"
run = "pnpm fix && cargo fmt --manifest-path src-tauri/Cargo.toml"

