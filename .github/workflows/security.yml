name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm rust cargo:cargo-audit
      - run: pnpm audit --audit-level high
      - run: cargo audit --file src-tauri/Cargo.lock
