name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing draft release tag created by Release Please
        required: true
        type: string
      release_body:
        description: Generated release notes written into latest.json
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_ASSET_NAME_PATTERN: "[name]-[version]-[platform]-[arch][setup][ext]"

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MISE_AUTO_INSTALL: "false"
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm rust

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const expected=fs.readFileSync('version.txt','utf8').trim();const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1];const tag=process.env.RELEASE_TAG;if(expected!==cargo){throw new Error('version.txt 与 Cargo.toml 版本不一致: '+expected+' != '+cargo)}if(tag && tag!=='v'+expected){throw new Error('release tag 与版本不一致: '+tag+' != v'+expected)}"
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxkbcommon-dev patchelf rpm xdg-utils

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - name: Manual updater test build
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Repack AppImage without host Wayland libraries
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # `tauri signer sign` prompts for a password unless one is provided
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ./tools/repack-appimage.sh

      - name: Upload manual test artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: voicepaste-test-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error

      - name: Build and publish Linux release
        if: inputs.release_tag != '' && runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: VoicePaste ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseAssetNamePattern: ${{ env.RELEASE_ASSET_NAME_PATTERN }}
          releaseDraft: true
          prerelease: false

      - name: Repack and republish AppImage without host Wayland libraries
        if: inputs.release_tag != '' && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./tools/repack-appimage.sh
          version="${RELEASE_TAG#v}"
          built="src-tauri/target/release/bundle/appimage/VoicePaste_${version}_amd64.AppImage"
          asset="VoicePaste-${version}-linux-amd64.AppImage"
          staging="$(mktemp -d)"
          cp "$built" "$staging/$asset"
          cp "$built.sig" "$staging/$asset.sig"
          gh release upload "$RELEASE_TAG" "$staging/$asset" "$staging/$asset.sig" --clobber

      - name: Build and publish macOS release
        if: inputs.release_tag != '' && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: VoicePaste ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseAssetNamePattern: ${{ env.RELEASE_ASSET_NAME_PATTERN }}
          releaseDraft: true
          prerelease: false

      - name: Build and publish Windows release
        if: inputs.release_tag != '' && runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: VoicePaste ${{ inputs.release_tag }}
          releaseBody: ${{ inputs.release_body }}
          releaseAssetNamePattern: ${{ env.RELEASE_ASSET_NAME_PATTERN }}
          releaseDraft: true
          prerelease: false

  # Every publish job rewrites latest.json, so the repacked AppImage signature is
  # synced once all of them are done. The updater rejects an update whose signature
  # does not match the published file.
  finalize:
    permissions:
      contents: write
    if: inputs.release_tag != ''
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Finalize updater manifest and release notes
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          version="${RELEASE_TAG#v}"
          appimage_asset="VoicePaste-${version}-linux-amd64.AppImage"
          gh release download "$RELEASE_TAG" --dir "$staging" \
            --pattern latest.json --pattern "$appimage_asset.sig"
          signature="$(cat "$staging/$appimage_asset.sig")"
          appimage_url="$(
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json assets \
              --jq ".assets[] | select(.name == \"$appimage_asset\") | .apiUrl"
          )"
          test -n "$appimage_url"
          jq --arg sig "$signature" --arg url "$appimage_url" \
            '(.platforms["linux-x86_64"], .platforms["linux-x86_64-appimage"]) |= (.signature = $sig | .url = $url)' \
            "$staging/latest.json" > "$staging/latest.patched.json"
          mv "$staging/latest.patched.json" "$staging/latest.json"

          # Existing installations select these stable target keys; asset filenames are
          # resolved from their URLs and can change without breaking upgrades.
          jq -e --arg version "$version" '
            .version == $version and (
              .platforms as $platforms
              | [
                  "darwin-aarch64",
                  "darwin-aarch64-app",
                  "linux-x86_64",
                  "linux-x86_64-appimage",
                  "linux-x86_64-deb",
                  "linux-x86_64-rpm",
                  "windows-x86_64",
                  "windows-x86_64-msi",
                  "windows-x86_64-nsis"
                ]
              | all(. as $key |
                  ($platforms[$key].url | type == "string" and length > 0) and
                  ($platforms[$key].signature | type == "string" and length > 0)
                )
            )
          ' "$staging/latest.json" >/dev/null
          gh release upload "$RELEASE_TAG" "$staging/latest.json" --clobber

          notes="$staging/release-notes.md"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body --jq .body > "$notes"
          if ! grep -qx '## 下载指南' "$notes"; then
            cat >> "$notes" <<'EOF'

          ## 下载指南

          - Windows 10/11 x64：下载 `VoicePaste-*-windows-x64-setup.exe`。
          - Apple Silicon Mac：下载 `VoicePaste-*-darwin-aarch64.dmg`。
          - Debian / Ubuntu x64：下载 `VoicePaste-*-linux-amd64.deb`。
          - Fedora / RHEL x64：下载 `VoicePaste-*-linux-x86_64.rpm`。
          - 其他 x64 Linux：下载 `VoicePaste-*-linux-amd64.AppImage`。

          `latest.json`、`.sig` 和 `.app.tar.gz` 用于应用内更新，普通用户无需手动下载。
          EOF
          fi
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file "$notes"
          jq -r '.platforms | keys[]' "$staging/latest.json"
