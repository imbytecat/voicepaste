name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MISE_AUTO_INSTALL: "false"
      RELEASE_BODY: |
        ## 下载指南

        - Windows 10/11 x64：下载 `*_Windows_x64-setup.exe`。
        - Apple Silicon Mac：下载 `*_macOS_aarch64.dmg`。
        - Debian / Ubuntu x64：下载 `*_Linux_amd64.deb`。
        - Fedora / RHEL x64：下载 `*_Linux_x86_64.rpm`。
        - 其他 x64 Linux：下载 `*_Linux_amd64.AppImage`。

        `latest.json`、`.sig` 和 `.app.tar.gz` 用于应用内更新，普通用户无需手动下载。
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm rust

      - name: Validate release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node -e "const v=require('fs').readFileSync('./src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1];if(process.env.GITHUB_REF_NAME!==('v'+v)){console.error('tag 与 Cargo.toml 版本不一致：cargo='+v+', tag='+process.env.GITHUB_REF_NAME);process.exit(1)}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxkbcommon-dev patchelf rpm xdg-utils

      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      - name: Manual updater test build
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Repack AppImage without host Wayland libraries
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # `tauri signer sign` prompts for a password unless one is provided
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: ./tools/repack-appimage.sh

      - name: Upload manual test artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: voicepaste-test-${{ runner.os }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.zip
          if-no-files-found: error

      - name: Build and publish Linux release
        if: github.event_name == 'push' && runner.os == 'Linux'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VoicePaste ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseAssetNamePattern: "[name]_[version]_Linux_[arch][setup][ext]"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Repack and republish AppImage without host Wayland libraries
        if: github.event_name == 'push' && runner.os == 'Linux'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          ./tools/repack-appimage.sh
          version="${GITHUB_REF_NAME#v}"
          built="src-tauri/target/release/bundle/appimage/VoicePaste_${version}_amd64.AppImage"
          asset="VoicePaste_${version}_Linux_amd64.AppImage"
          staging="$(mktemp -d)"
          cp "$built" "$staging/$asset"
          cp "$built.sig" "$staging/$asset.sig"
          gh release upload "$GITHUB_REF_NAME" "$staging/$asset" "$staging/$asset.sig" --clobber

      - name: Build and publish macOS release
        if: github.event_name == 'push' && runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VoicePaste ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseAssetNamePattern: "[name]_[version]_macOS_[arch][setup][ext]"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Build and publish Windows release
        if: github.event_name == 'push' && runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: VoicePaste ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseAssetNamePattern: "[name]_[version]_Windows_[arch][setup][ext]"
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

  # Every publish job rewrites latest.json, so the repacked AppImage signature is
  # synced once all of them are done. The updater rejects an update whose signature
  # does not match the published file.
  sync-updater-signature:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Point latest.json at the repacked AppImage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          gh release download "$GITHUB_REF_NAME" --dir "$staging" \
            --pattern latest.json --pattern '*_Linux_amd64.AppImage.sig'
          signature="$(cat "$staging"/*_Linux_amd64.AppImage.sig)"
          jq --arg sig "$signature" \
            '(.platforms["linux-x86_64"], .platforms["linux-x86_64-appimage"]) |= (.signature = $sig)' \
            "$staging/latest.json" > "$staging/latest.patched.json"
          mv "$staging/latest.patched.json" "$staging/latest.json"
          gh release upload "$GITHUB_REF_NAME" "$staging/latest.json" --clobber
          jq -r '.platforms | keys[]' "$staging/latest.json"
