name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  frontend:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  rust:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release):')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxkbcommon-dev
      - uses: jdx/mise-action@v4
        with:
          install_args: ${{ runner.os == 'Windows' && 'node pnpm rust' || 'rust' }}
      - name: Validate release version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < version.txt)"
          actual="$(cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "voicepaste") | .version')"
          test "$expected" = "$actual" || {
            echo "::error::version.txt 与 Cargo metadata 版本不一致: $expected != $actual"
            exit 1
          }
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
          key: cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-src-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Cargo target
        uses: actions/cache@v6
        with:
          path: src-tauri/target/
          key: cargo-target-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-target-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify Windows executable manifests and startup
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm tauri build --debug --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/mt.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$mt) { throw "Windows SDK manifest tool not found" }
          $test = Get-ChildItem src-tauri/target/debug/deps/voicepaste_lib-*.exe |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          foreach ($exe in @($test.FullName, (Resolve-Path src-tauri/target/debug/voicepaste.exe).Path)) {
            $manifest = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($exe) + ".manifest")
            & $mt.FullName "-inputresource:$exe;#1" "-out:$manifest"
            if ($LASTEXITCODE -ne 0) { throw "Missing executable manifest: $exe" }
            [xml]$xml = Get-Content $manifest -Raw
            $controls = $xml.SelectSingleNode("//*[local-name()='assemblyIdentity' and @name='Microsoft.Windows.Common-Controls']")
            if (!$controls -or $controls.version -ne '6.0.0.0') { throw "Common Controls v6 missing: $exe" }
            Write-Output "Common Controls v6 verified: $exe"
          }
          ./tools/check-windows-startup.ps1
      - name: Upload Windows startup screenshot
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-startup
          path: ${{ runner.temp }}/voicepaste-startup.png
          if-no-files-found: error
          retention-days: 7
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
