version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      npm-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "03:10"
      timezone: Asia/Shanghai
    groups:
      rust-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
